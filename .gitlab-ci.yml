# Include Rust-specific CI configuration
include:
  - local: '.gitlab/ci/rust.gitlab-ci.yml'
  - local: '.gitlab/ci/devcontainer.gitlab-ci.yml'
  - local: '.gitlab/ci/semantic-release.gitlab-ci.yml'

# Global variables for package versions
variables:
  # renovate: datasource=npm depName=@commitlint/cli
  COMMITLINT_CLI_VERSION: "20.5.3"
  # renovate: datasource=npm depName=@commitlint/config-conventional
  COMMITLINT_CONFIG_VERSION: "20.5.3"

default:
  interruptible: true

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: none
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^renovate\// && $CI_PIPELINE_SOURCE == "merge_request_event"'
      auto_cancel:
        on_new_commit: interruptible
        on_job_failure: all
    - if: $CI_PIPELINE_SOURCE == "schedule"
      auto_cancel:
        on_new_commit: none
        on_job_failure: none
    - if: $CI_COMMIT_TAG
      auto_cancel:
        on_new_commit: none
        on_job_failure: none
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /^chore\(release\):/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# Pipeline stages
stages:
  - build
  - test
  - lint
  - docs
  - release

# Commit lint job - check commit message format
commitlint:
  image: node:24.16.0@sha256:40ad9f3064e67d6860b4bc3fe1880b2953934fd6320ada990e45fe0efa6badd7
  stage: lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_TAG"
      when: never
  variables:
    GIT_FETCH_EXTRA_FLAGS: "+refs/heads/main:refs/remotes/origin/main"
  before_script:
    - npm install -g @commitlint/cli@${COMMITLINT_CLI_VERSION} @commitlint/config-conventional@${COMMITLINT_CONFIG_VERSION}
  script:
    - commitlint --from=$(git merge-base origin/main HEAD) --to=$CI_COMMIT_SHA
