[package]
name = "rmcp-server-builder"
version = "0.4.2"
edition = "2024"
rust-version = "1.88"
description = "Composable MCP server builder for zero-boilerplate capability composition"
license = "MIT"
repository = "https://gitlab.com/lx-industries/rmcp-server-builder"
keywords = ["mcp", "rmcp", "modelcontextprotocol", "server", "builder"]
categories = ["development-tools"]

[dependencies]
rmcp = { version = "3.9.0", features = ["server"] }
tokio-util = "0.7.20"

[dev-dependencies]
rmcp = { version = "3.9.0", features = ["client", "server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
