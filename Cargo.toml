[package]
name = "rmcp-server-builder"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Composable MCP server builder for zero-boilerplate capability composition"
license = "MIT"
repository = "https://gitlab.com/lx-industries/rmcp-server-builder"
keywords = ["mcp", "rmcp", "modelcontextprotocol", "server", "builder"]
categories = ["development-tools"]

[dependencies]
rmcp = { version = "3.5.1", features = ["server"] }

[dev-dependencies]
rmcp = { version = "3.5.1", features = ["client", "server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
